name: Python Wheels

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev
      - feature/*
  release:
    types:
      - published

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build SDist
        run: pipx run build --sdist

      - name: Check metadata
        run: pipx run twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.tar.gz
          name: sdist
          overwrite: true


  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Absolute path to the vcpkg binary cache, as seen by the build. On Linux the
          # build runs in a container that receives a *copy* of the project, so the cache
          # is addressed through the host root that cibuildwheel bind-mounts at /host.
          - os: ubuntu-latest
            binary_cache: /host${{ github.workspace }}/vcpkg-binary-cache
          - os: windows-latest
            binary_cache: ${{ github.workspace }}/vcpkg-binary-cache
          - os: macos-latest
            binary_cache: ${{ github.workspace }}/vcpkg-binary-cache

    env:
      VCPKG_LIBRARY_LINKAGE: static
      # Read directly by vcpkg on Windows/macOS; forwarded into the container on Linux by
      # environment-pass in pyproject.toml.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ matrix.binary_cache }}

    steps:
      - uses: actions/checkout@v7

      # Relative path on purpose: github.workspace is backslash-separated on Windows, which
      # bash would read as escapes. vcpkg requires this directory to already exist.
      - name: Prepare vcpkg binary cache
        run: mkdir -p vcpkg-binary-cache
        shell: bash

      - name: Cache vcpkg dependencies
        uses: actions/cache@v6
        with:
          path: vcpkg-binary-cache
          # vcpkg keys each archive by its own per-package ABI hash, so an entry that no
          # longer applies is ignored rather than misused; a broad restore-key is safe.
          key: vcpkg-wheels-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-wheels-${{ runner.os }}-${{ runner.arch }}-

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_ARCHS: auto64

      - name: Verify clean directory
        run: git diff --exit-code
        shell: bash

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          path: wheelhouse/*.whl
          name: wheels-${{ matrix.os }}
          overwrite: true


  upload_all:
    name: Upload if release
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - name: Download wheels (all platforms)
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist/

      - name: List files to upload
        run: ls -l dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
