name: Python Wheels

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev
      - feature/*
  release:
    types:
      - published

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build SDist
        run: pipx run build --sdist

      - name: Check metadata
        run: pipx run twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.tar.gz
          name: sdist
          overwrite: true


  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # On Linux the build runs in a container that gets a *copy* of the project, so
          # the cache is reached through the host root cibuildwheel mounts at /host.
          - os: ubuntu-latest
            host_prefix: /host
          - os: windows-latest
            host_prefix: ""
          - os: macos-latest
            host_prefix: ""

    env:
      VCPKG_LIBRARY_LINKAGE: static

    steps:
      - uses: actions/checkout@v7

      # The absolute path is resolved here, not in the matrix: matrix values are expanded
      # before a runner is assigned, when github.workspace is still empty. vcpkg requires
      # the directory to already exist. Read directly by vcpkg on Windows/macOS, and
      # forwarded into the container on Linux by environment-pass in pyproject.toml.
      - name: Prepare vcpkg binary cache
        shell: bash
        run: |
          mkdir -p vcpkg-binary-cache
          echo "VCPKG_DEFAULT_BINARY_CACHE=${{ matrix.host_prefix }}${GITHUB_WORKSPACE}/vcpkg-binary-cache" >> "$GITHUB_ENV"

      - name: Cache vcpkg dependencies
        uses: actions/cache@v6
        with:
          path: vcpkg-binary-cache
          # vcpkg keys each archive by its own per-package ABI hash, so an entry that no
          # longer applies is ignored rather than misused; a broad restore-key is safe.
          key: vcpkg-wheels-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-wheels-${{ runner.os }}-${{ runner.arch }}-

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_ARCHS: auto64

      - name: Verify clean directory
        run: git diff --exit-code
        shell: bash

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          path: wheelhouse/*.whl
          name: wheels-${{ matrix.os }}
          overwrite: true


  upload_all:
    name: Upload if release
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - name: Download wheels (all platforms)
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist/

      - name: List files to upload
        run: ls -l dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
