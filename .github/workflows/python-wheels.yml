name: Python Wheels

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev
      - feature/*
  release:
    types:
      - published

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build SDist
        run: pipx run build --sdist

      - name: Check metadata
        run: pipx run twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.tar.gz
          name: sdist
          overwrite: true


  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # On Linux the build runs in a container that gets a *copy* of the project, so
          # the cache is reached through the host root cibuildwheel mounts at /host.
          - os: ubuntu-latest
            host_prefix: /host
            cmake_args: ""
          - os: windows-latest
            host_prefix: ""
            cmake_args: ""
          # TEMPORARY (diagnostic): RelWithDebInfo keeps NDEBUG and -O2 but skips the
          # strip -x that pybind11_add_module applies in Release. That strip removes local
          # symbols -- which is all of them, given hidden visibility -- leaving atos unable
          # to name a single frame in the crash report. Revert once the segfault is fixed:
          # it makes the shipped wheel considerably larger.
          - os: macos-latest
            host_prefix: ""
            cmake_args: "-DCMAKE_BUILD_TYPE=RelWithDebInfo"

    env:
      VCPKG_LIBRARY_LINKAGE: static
      # Appended after setup.py's own -DCMAKE_BUILD_TYPE, so it overrides it.
      CMAKE_ARGS: ${{ matrix.cmake_args }}

    steps:
      - uses: actions/checkout@v7

      # The absolute path is resolved here, not in the matrix: matrix values are expanded
      # before a runner is assigned, when github.workspace is still empty. vcpkg requires
      # the directory to already exist. Read directly by vcpkg on Windows/macOS, and
      # forwarded into the container on Linux by environment-pass in pyproject.toml.
      - name: Prepare vcpkg binary cache
        shell: bash
        run: |
          mkdir -p vcpkg-binary-cache
          echo "VCPKG_DEFAULT_BINARY_CACHE=${{ matrix.host_prefix }}${GITHUB_WORKSPACE}/vcpkg-binary-cache" >> "$GITHUB_ENV"

      - name: Cache vcpkg dependencies
        uses: actions/cache@v6
        with:
          path: vcpkg-binary-cache
          # vcpkg keys each archive by its own per-package ABI hash, so an entry that no
          # longer applies is ignored rather than misused; a broad restore-key is safe.
          key: vcpkg-wheels-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-wheels-${{ runner.os }}-${{ runner.arch }}-

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_ARCHS: auto64

      # A segfault inside the test phase only leaves Python-level frames in the log. The
      # macOS crash report names the faulting library and gives the native backtrace,
      # which is what distinguishes our code from a clash between the statically linked
      # netCDF/HDF5 and the copies netCDF4 brings in.
      - name: Collect macOS crash reports
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          # ReportCrash writes asynchronously; give it a moment to flush.
          sleep 15
          mkdir -p crash-reports
          for dir in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            [ -d "$dir" ] && cp -R "$dir/." crash-reports/ 2>/dev/null || true
          done
          found=$(find crash-reports -type f \( -name '*.ips' -o -name '*.crash' \) | wc -l)
          echo "Collected $found crash report(s)."
          # Echo them into the log too, so the cause is visible without downloading.
          find crash-reports -type f \( -name '*.ips' -o -name '*.crash' \) -print0 |
            while IFS= read -r -d '' f; do
              echo "::group::$f"
              head -c 20000 "$f"
              echo
              echo "::endgroup::"
            done

      # cibuildwheel deletes its temp tree (venv and installed module included) in a
      # finally block, so the crashed binary is already gone by now. On macOS the build
      # happens in place, so setup.py's output under build/lib.macosx-*/ is the same code
      # at the same offsets; the script UUID-matches it against the report before trusting
      # it. Never fails the job -- it only ever adds information.
      - name: Symbolicate macOS crash reports
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: python3 ci/symbolicate_macos_crash.py crash-reports build | tee crash-reports/symbolicated.txt

      - name: Upload macOS crash reports
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: macos-crash-reports
          path: crash-reports/
          if-no-files-found: warn
          overwrite: true

      - name: Verify clean directory
        run: git diff --exit-code
        shell: bash

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          path: wheelhouse/*.whl
          name: wheels-${{ matrix.os }}
          overwrite: true


  upload_all:
    name: Upload if release
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - name: Download wheels (all platforms)
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist/

      - name: List files to upload
        run: ls -l dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
